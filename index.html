<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تسجيل النواقص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ============ الأساسيات ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --glass:rgba(255,255,255,.09);
  --glass-2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.22);
  --text:#f2f6ff;
  --muted:rgba(242,246,255,.62);
  --accent:#6ee7ff;
  --accent2:#a78bfa;
  --accent3:#f472b6;
  --ok:#34d399;
  --danger:#fb7185;
  --warn:#fbbf24;
}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh;color:var(--text);
  background:#060a16;overflow-x:hidden;
  padding-bottom:60px;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#6ee7ff,#a78bfa);border-radius:20px}

/* ============ الخلفية المتحركة ============ */
.bg-gradient{
  position:fixed;inset:-20%;z-index:-3;
  background:
    radial-gradient(circle at 18% 22%, #1b2a6b 0%, transparent 42%),
    radial-gradient(circle at 82% 12%, #4c1d95 0%, transparent 42%),
    radial-gradient(circle at 74% 82%, #0e7490 0%, transparent 42%),
    radial-gradient(circle at 16% 86%, #831843 0%, transparent 42%),
    #060a16;
  background-size:180% 180%;
  animation:bgMove 22s ease-in-out infinite alternate;
}
@keyframes bgMove{
  0%{background-position:0% 0%}
  50%{background-position:100% 60%}
  100%{background-position:40% 100%}
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-2;pointer-events:none}
.orb.o1{width:340px;height:340px;background:#3b82f6;top:-90px;right:-70px;animation:float1 16s ease-in-out infinite}
.orb.o2{width:300px;height:300px;background:#a855f7;bottom:-90px;left:-70px;animation:float2 19s ease-in-out infinite}
.orb.o3{width:260px;height:260px;background:#06b6d4;top:45%;left:42%;animation:float3 24s ease-in-out infinite}
.orb.o4{width:220px;height:220px;background:#ec4899;bottom:18%;right:6%;animation:float1 21s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,60px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-50px) scale(1.2)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-70px,-40px) scale(.9)}66%{transform:translate(50px,50px) scale(1.1)}}

/* ============ الحاوية ============ */
.container{max-width:1260px;margin:0 auto;padding:26px 16px 90px}

/* ============ الزجاج ============ */
.glass{
  background:linear-gradient(155deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
  border:1px solid var(--border);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 18px 50px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.25);
}

/* ============ الهيدر ============ */
header.top{
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
  padding:22px 26px;border-radius:26px;margin-bottom:22px;
  animation:fadeUp .7s ease both;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 26px rgba(110,231,255,.4);
  animation:pulseGlow 3.2s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 10px 26px rgba(110,231,255,.35)}
  50%{box-shadow:0 10px 40px rgba(167,139,250,.6)}
}
.brand h1{
  font-size:clamp(1.15rem,2.4vw,1.6rem);font-weight:900;letter-spacing:-.3px;
  background:linear-gradient(90deg,#fff,var(--accent) 45%,var(--accent2) 75%,var(--accent3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% auto;animation:shineText 6s linear infinite;
}
@keyframes shineText{to{background-position:220% center}}
.brand p{font-size:.78rem;color:var(--muted);margin-top:2px}
.top-badges{display:flex;flex-wrap:wrap;gap:10px}
.pill{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  font-size:.78rem;font-weight:700;color:var(--muted);
  transition:.3s;backdrop-filter:blur(10px);
}
.pill b{color:#fff;font-size:.9rem}
.pill.saved{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ الأزرار ============ */
.btn{
  position:relative;overflow:hidden;border:none;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:.86rem;
  padding:12px 22px;border-radius:15px;color:#fff;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, background .3s, border-color .3s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn::after{
  content:'';position:absolute;top:0;left:-130%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-22deg);transition:left .65s ease;pointer-events:none;
}
.btn:hover::after{left:135%}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0) scale(.96)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--muted)}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.14);box-shadow:0 12px 28px rgba(0,0,0,.3)}
.btn-save{
  background:linear-gradient(135deg,var(--accent),var(--accent2) 55%,var(--accent3));
  color:#07101f;font-weight:900;font-size:.95rem;padding:14px 30px;
  box-shadow:0 12px 34px rgba(110,231,255,.35), 0 0 0 1px rgba(255,255,255,.15) inset;
}
.btn-save:hover{
  box-shadow:0 18px 46px rgba(167,139,250,.55), 0 0 0 1px rgba(255,255,255,.3) inset;
  transform:translateY(-4px) scale(1.02);
}
.btn-save:active{transform:translateY(0) scale(.97)}
.btn-add{
  grid-column:1/-1;margin-top:4px;
  background:linear-gradient(135deg,rgba(110,231,255,.22),rgba(167,139,250,.22));
  border:1px solid rgba(110,231,255,.35);color:var(--accent);
}
.btn-add:hover{
  background:linear-gradient(135deg,rgba(110,231,255,.35),rgba(167,139,250,.35));
  color:#fff;box-shadow:0 10px 28px rgba(110,231,255,.3);border-color:rgba(110,231,255,.7);
}
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:scale(0);animation:rip .65s ease-out;pointer-events:none;
}
@keyframes rip{to{transform:scale(2.8);opacity:0}}

/* ============ الأقسام ============ */
.sections-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:20px;margin-bottom:26px;
}
.section{
  position:relative;border-radius:24px;padding:18px;overflow:hidden;
  background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 16px 44px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .35s cubic-bezier(.34,1.4,.64,1), box-shadow .35s, border-color .35s;
  animation:fadeUp .6s ease both;
}
.section::before{
  content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.12), transparent 55%);
  opacity:0;transition:opacity .4s;
}
.section:hover::before{opacity:1}
.section:hover{
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.42);
  box-shadow:0 26px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1) inset;
}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-icon{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--sec-color) 35%, transparent), rgba(255,255,255,.06));
  border:1px solid color-mix(in srgb, var(--sec-color) 45%, transparent);
  box-shadow:0 8px 22px color-mix(in srgb, var(--sec-color) 30%, transparent);
  transition:.35s;
}
.section:hover .sec-icon{transform:rotate(-8deg) scale(1.08)}
.sec-titles h2{font-size:1rem;font-weight:800;letter-spacing:.2px}
.sec-count{font-size:.72rem;color:var(--muted);font-weight:600}
.sec-count b{color:var(--sec-color)}

/* ============ العناصر ============ */
.items{display:flex;flex-direction:column;gap:8px;max-height:290px;overflow-y:auto;padding-left:2px}
.items::-webkit-scrollbar{width:5px}
.empty{
  text-align:center;padding:18px 10px;border-radius:14px;font-size:.78rem;color:var(--muted);
  background:rgba(255,255,255,.035);border:1px dashed rgba(255,255,255,.14);
}
.item{
  display:grid;grid-template-columns:26px 1fr 62px 62px 30px;gap:7px;align-items:end;
  padding:9px;border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  transition:.3s;animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(-6px)}to{opacity:1;transform:none}}
.item:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);transform:translateX(-3px)}
.idx{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font-size:.72rem;font-weight:900;margin-bottom:2px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07101f;
  box-shadow:0 4px 12px rgba(110,231,255,.35);
}
.cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.flabel{font-size:.63rem;font-weight:700;color:var(--muted);padding-right:3px}

/* ============ المدخلات ============ */
.inp{
  width:100%;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--text);
  padding:9px 11px;border-radius:11px;outline:none;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  transition:.25s;
}
.inp::placeholder{color:rgba(255,255,255,.35);font-weight:500}
.inp:hover{background:rgba(255,255,255,.1)}
.inp:focus{
  border-color:var(--accent);background:rgba(255,255,255,.13);
  box-shadow:0 0 0 3px rgba(110,231,255,.16), 0 6px 18px rgba(110,231,255,.12);
}
.inp.num{text-align:center;padding:9px 4px;font-weight:800}
.inp.num::-webkit-outer-spin-button,.inp.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp.num{-moz-appearance:textfield;appearance:textfield}
.item-name{font-weight:700}

/* زر الحذف */
.del{
  position:relative;overflow:hidden;cursor:pointer;font-family:inherit;
  width:30px;height:32px;border-radius:10px;margin-bottom:2px;
  display:grid;place-items:center;font-size:.8rem;font-weight:900;
  background:rgba(251,113,133,.12);color:var(--danger);
  border:1px solid rgba(251,113,133,.28);transition:.28s;
}
.del:hover{background:rgba(251,113,133,.3);color:#fff;transform:rotate(90deg) scale(1.12);box-shadow:0 8px 20px rgba(251,113,133,.4)}
.del:active{transform:rotate(90deg) scale(.95)}

.add-form{display:grid;grid-template-columns:1fr 62px 62px;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}

/* ============ لوحة الحفظ ============ */
.save-panel{
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
  padding:20px 24px;border-radius:24px;margin-bottom:26px;
  animation:fadeUp .8s ease both;
}
.sum{display:flex;gap:12px;flex-wrap:wrap}
.sum-item{
  min-width:86px;text-align:center;padding:10px 16px;border-radius:16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
  transition:.3s;
}
.sum-item:hover{background:rgba(255,255,255,.12);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.sum-item span{
  display:block;font-size:1.35rem;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sum-item small{font-size:.7rem;color:var(--muted);font-weight:700}
.save-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ============ الفواتير ============ */
.inv-title-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:0 6px}
.inv-title-bar h2{font-size:1.05rem;font-weight:900}
.badge{
  padding:4px 13px;border-radius:999px;font-size:.74rem;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07101f;
  box-shadow:0 6px 18px rgba(110,231,255,.35);
}
.invoices{display:flex;flex-direction:column;gap:14px}
.invoice{
  border-radius:22px;overflow:hidden;
  background:linear-gradient(155deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 14px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2);
  transition:.35s;animation:fadeUp .5s ease both;
}
.invoice:hover{border-color:rgba(255,255,255,.38);box-shadow:0 20px 52px rgba(0,0,0,.42);transform:translateY(-2px)}
.inv-head{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 20px;cursor:pointer;transition:.3s;position:relative;overflow:hidden;
}
.inv-head::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  transform:translateX(-100%);transition:transform .8s;
}
.inv-head:hover::after{transform:translateX(100%)}
.inv-num{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:.8rem;font-weight:900;flex-shrink:0;
  background:linear-gradient(135deg,rgba(52,211,153,.3),rgba(110,231,255,.25));
  border:1px solid rgba(52,211,153,.4);color:var(--ok);
}
.inv-meta{flex:1;min-width:170px}
.inv-meta h3{font-size:.88rem;font-weight:800;margin-bottom:3px}
.inv-meta p{font-size:.72rem;color:var(--muted);font-weight:600}
.inv-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  padding:6px 13px;border-radius:11px;font-size:.71rem;font-weight:800;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:var(--muted);
}
.stat b{color:var(--accent);font-size:.8rem}
.chev{font-size:.85rem;color:var(--muted);transition:.35s}
.invoice.open .chev{transform:rotate(180deg);color:var(--accent)}
.inv-body{
  max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1);
  border-top:1px solid rgba(255,255,255,0);
}
.invoice.open .inv-body{max-height:1400px;border-top-color:rgba(255,255,255,.1)}
.inv-body-inner{padding:16px 20px 20px;max-height:420px;overflow-y:auto}
.grp{margin-bottom:14px}
.grp:last-child{margin-bottom:0}
.grp-head{
  display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;
  color:var(--accent);margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px dashed rgba(255,255,255,.14);
}
.inv-item{
  display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;
  padding:7px 10px;border-radius:10px;font-size:.78rem;font-weight:600;
  transition:.25s;
}
.inv-item:hover{background:rgba(255,255,255,.06)}
.inv-idx{font-size:.66rem;font-weight:900;color:var(--muted)}
.inv-name{font-weight:700}
.qty-tag{
  padding:3px 10px;border-radius:8px;font-size:.68rem;font-weight:800;
  background:rgba(110,231,255,.13);color:var(--accent);border:1px solid rgba(110,231,255,.22);
}
.qty-tag.p{background:rgba(244,114,182,.13);color:var(--accent3);border-color:rgba(244,114,182,.22)}
.empty-inv{
  text-align:center;padding:46px 20px;border-radius:22px;color:var(--muted);font-size:.85rem;font-weight:600;
  background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.16);
}
.empty-inv span{display:block;font-size:2.4rem;margin-bottom:10px;opacity:.6}

/* ============ التوست ============ */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{
  padding:12px 24px;border-radius:16px;font-size:.82rem;font-weight:800;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  animation:toastIn .45s cubic-bezier(.34,1.56,.64,1) both;
  display:flex;align-items:center;gap:9px;white-space:nowrap;
}
.toast.ok{background:rgba(52,211,153,.22);color:#7dffcf;border-color:rgba(52,211,153,.45)}
.toast.warn{background:rgba(251,191,36,.22);color:#ffe08a;border-color:rgba(251,191,36,.45)}
.toast.del{background:rgba(251,113,133,.22);color:#ffb3c0;border-color:rgba(251,113,133,.45)}
.toast.out{animation:toastOut .35s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(28px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.94)}}

@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.shake{animation:shake .5s}

/* ============ الجوال ============ */
@media(max-width:640px){
  .container{padding:16px 11px 80px}
  header.top{padding:17px 16px;border-radius:20px}
  .sections-grid{grid-template-columns:1fr;gap:16px}
  .section{padding:15px;border-radius:20px}
  .item{grid-template-columns:24px 1fr 56px 56px 28px;gap:5px;padding:8px 7px}
  .inp{font-size:.78rem;padding:8px 9px}
  .flabel{font-size:.58rem}
  .save-panel{padding:16px;border-radius:20px}
  .sum{width:100%;justify-content:space-between}
  .sum-item{flex:1;min-width:0;padding:9px 8px}
  .save-actions{width:100%}
  .save-actions .btn{flex:1}
  .inv-head{padding:13px 15px;gap:10px}
  .inv-stats{width:100%}
}
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>

<div class="container">

  <!-- الهيدر -->
  <header class="top glass">
    <div class="brand">
      <div class="brand-icon">📋</div>
      <div>
        <h1>نظام تسجيل النواقص</h1>
        <p>سجّل النواقص في فاتورة واحدة · حفظ تلقائي</p>
      </div>
    </div>
    <div class="top-badges">
      <div class="pill saved" id="savePill"><span class="dot"></span> الحفظ التلقائي مُفعّل</div>
      <div class="pill">الفواتير <b id="pillInvoices">0</b></div>
    </div>
  </header>

  <!-- الأقسام -->
  <div class="sections-grid" id="sections"></div>

  <!-- لوحة الحفظ -->
  <div class="save-panel glass">
    <div class="sum">
      <div class="sum-item"><span id="sumItems">0</span><small>أصناف</small></div>
      <div class="sum-item"><span id="sumCartons">0</span><small>كراتين</small></div>
      <div class="sum-item"><span id="sumPieces">0</span><small>قطع</small></div>
    </div>
    <div class="save-actions">
      <button class="btn btn-ghost" id="clearDraft">🗑️ مسح الكل</button>
      <button class="btn btn-save" id="saveInvoice">💾 حفظ الفاتورة</button>
    </div>
  </div>

  <!-- سجل الفواتير -->
  <div class="inv-title-bar">
    <h2>🧾 سجل الفواتير المحفوظة</h2>
    <span class="badge" id="invCount">0</span>
  </div>
  <div class="invoices" id="invoices"></div>

</div>

<div id="toasts"></div>

<script>
/* ============================================================
   البيانات
   ============================================================ */
const STORAGE_KEY = 'naqasat_app_v1';

const SECTIONS = [
  { id:'food',     name:'غذائيات',   icon:'🍚', color:'#fbbf24' },
  { id:'cheese',   name:'أجبان',     icon:'🧀', color:'#f59e0b' },
  { id:'sweets',   name:'حلويات',    icon:'🍬', color:'#f472b6' },
  { id:'cleaners', name:'منظفات',    icon:'🧴', color:'#38bdf8' },
  { id:'misc',     name:'عشوائيات',  icon:'📦', color:'#a78bfa' }
];

const AR_LOCALE = 'ar-EG-u-nu-latn';

let state = {
  draft: {},        // { food:[{id,name,cartons,pieces}], ... }
  invoices: [],     // [{id, seq, dateISO, items:[...]}]
  seq: 0
};
SECTIONS.forEach(s => state.draft[s.id] = []);

/* ============================================================
   أدوات مساعدة
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function secName(id){ const s = SECTIONS.find(x=>x.id===id); return s ? s.name : ''; }
function secIcon(id){ const s = SECTIONS.find(x=>x.id===id); return s ? s.icon : '📦'; }

/* التاريخ والوقت بالعربية */
function formatDate(d){
  return d.toLocaleDateString(AR_LOCALE, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
function formatTime(d){
  return d.toLocaleTimeString(AR_LOCALE, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

/* ============================================================
   التخزين (حفظ تلقائي)
   ============================================================ */
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSaved();
  }catch(e){ console.warn('تعذّر الحفظ:', e); }
}

let flashTimer = null;
function flashSaved(){
  const pill = document.getElementById('savePill');
  if(!pill) return;
  pill.innerHTML = '<span class="dot"></span> تم الحفظ التلقائي ✓';
  pill.classList.add('saved');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{
    pill.innerHTML = '<span class="dot"></span> الحفظ التلقائي مُفعّل';
  }, 1600);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.draft){
      SECTIONS.forEach(s=>{
        state.draft[s.id] = Array.isArray(data.draft[s.id]) ? data.draft[s.id] : [];
      });
    }
    if(Array.isArray(data.invoices)) state.invoices = data.invoices;
    if(typeof data.seq === 'number') state.seq = data.seq;
  }catch(e){ console.warn('تعذّر التحميل:', e); }
}

/* ============================================================
   التوست
   ============================================================ */
function toast(msg, type='ok'){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { ok:'✓', warn:'⚠', del:'🗑' };
  el.innerHTML = `<span>${icons[type]||'✓'}</span><span>${escapeHtml(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 350); }, 2300);
}

/* ============================================================
   بناء الأقسام
   ============================================================ */
function buildSections(){
  const wrap = document.getElementById('sections');
  wrap.innerHTML = SECTIONS.map((sec, i)=>`
    <section class="section" data-sec="${sec.id}" style="--sec-color:${sec.color};animation-delay:${i*0.07}s">
      <div class="sec-head">
        <div class="sec-icon">${sec.icon}</div>
        <div class="sec-titles">
          <h2>${sec.name}</h2>
          <span class="sec-count" id="count-${sec.id}"><b>0</b> صنف</span>
        </div>
      </div>
      <div class="items" id="list-${sec.id}"></div>
      <div class="add-form">
        <div class="cell">
          <span class="flabel">اسم المنتج</span>
          <input class="inp" data-role="name" placeholder="اكتب اسم المنتج...">
        </div>
        <div class="cell">
          <span class="flabel">كراتين</span>
          <input class="inp num" type="number" min="0" value="1" data-role="cartons">
        </div>
        <div class="cell">
          <span class="flabel">قطع</span>
          <input class="inp num" type="number" min="0" value="0" data-role="pieces">
        </div>
        <button class="btn btn-add" data-add="${sec.id}">＋ إضافة الصنف</button>
      </div>
    </section>
  `).join('');

  /* إضافة صنف */
  wrap.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=> addItem(btn.dataset.add, btn.closest('.section')));
  });

  /* Enter للإضافة */
  wrap.querySelectorAll('.add-form .inp').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const secEl = inp.closest('.section');
        addItem(secEl.dataset.sec, secEl);
      }
    });
  });

  /* توهج يتبع الماوس */
  wrap.querySelectorAll('.section').forEach(sec=>{
    sec.addEventListener('mousemove', e=>{
      const r = sec.getBoundingClientRect();
      sec.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      sec.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

/* ============================================================
   إضافة صنف
   ============================================================ */
function addItem(secId, secEl){
  const nameInp    = secEl.querySelector('[data-role="name"]');
  const cartonsInp = secEl.querySelector('[data-role="cartons"]');
  const piecesInp  = secEl.querySelector('[data-role="pieces"]');

  const name = nameInp.value.trim();
  if(!name){
    secEl.classList.add('shake');
    setTimeout(()=>secEl.classList.remove('shake'), 520);
    toast('اكتب اسم المنتج أولاً', 'warn');
    nameInp.focus();
    return;
  }

  const cartons = Math.max(0, parseInt(cartonsInp.value) || 0);
  const pieces  = Math.max(0, parseInt(piecesInp.value)  || 0);

  state.draft[secId].push({ id: uid(), name, cartons, pieces });

  nameInp.value = '';
  cartonsInp.value = 1;
  piecesInp.value = 0;

  persist();
  renderSection(secId);
  renderSummary();
  nameInp.focus();

  toast('تمت الإضافة إلى ' + secName(secId), 'ok');
}

/* ============================================================
   رسم قسم واحد
   ============================================================ */
function renderSection(secId){
  const list = document.getElementById('list-' + secId);
  const countEl = document.getElementById('count-' + secId);
  if(!list) return;

  const items = state.draft[secId] || [];
  countEl.innerHTML = `<b>${items.length}</b> صنف`;

  if(items.length === 0){
    list.innerHTML = `<div class="empty">لا توجد أصناف مسجّلة بعد</div>`;
    return;
  }

  list.innerHTML = items.map((it, i)=>`
    <div class="item" data-id="${it.id}">
      <span class="idx">${i + 1}</span>
      <div class="cell">
        <span class="flabel">المنتج</span>
        <input class="inp item-name" data-field="name" value="${escapeHtml(it.name)}">
      </div>
      <div class="cell">
        <span class="flabel">كراتين</span>
        <input class="inp num" type="number" min="0" data-field="cartons" value="${it.cartons}">
      </div>
      <div class="cell">
        <span class="flabel">قطع</span>
        <input class="inp num" type="number" min="0" data-field="pieces" value="${it.pieces}">
      </div>
      <button class="del" data-del="${it.id}" title="حذف">✕</button>
    </div>
  `).join('');

  /* تعديل مباشر */
  list.querySelectorAll('[data-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const row  = inp.closest('.item');
      const item = (state.draft[secId] || []).find(x => x.id === row.dataset.id);
      if(!item) return;

      const f = inp.dataset.field;
      if(f === 'name'){
        item.name = inp.value;
      }else{
        item[f] = Math.max(0, parseInt(inp.value) || 0);
      }
      persist();
      renderSummary();
    });
  });

  /* حذف */
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.draft[secId] = state.draft[secId].filter(x => x.id !== btn.dataset.del);
      persist();
      renderSection(secId);
      renderSummary();
      toast('تم حذف الصنف', 'del');
    });
  });
}

/* ============================================================
   الملخص
   ============================================================ */
function renderSummary(){
  let items = 0, cartons = 0, pieces = 0;
  SECTIONS.forEach(s=>{
    (state.draft[s.id] || []).forEach(it=>{
      items++;
      cartons += Number(it.cartons) || 0;
      pieces  += Number(it.pieces)  || 0;
    });
  });
  document.getElementById('sumItems').textContent   = items;
  document.getElementById('sumCartons').textContent = cartons;
  document.getElementById('sumPieces').textContent  = pieces;
}

/* ============================================================
   حفظ الفاتورة
   ============================================================ */
function saveInvoice(){
  const items = [];
  SECTIONS.forEach(sec=>{
    (state.draft[sec.id] || []).forEach(it=>{
      items.push({
        name: it.name,
        cartons: Number(it.cartons) || 0,
        pieces:  Number(it.pieces)  || 0,
        sectionId: sec.id,
        section: sec.name,
        icon: sec.icon
      });
    });
  });

  if(items.length === 0){
    toast('لا توجد أصناف لتسجيلها', 'warn');
    return;
  }

  const now = new Date();
  state.seq = (state.seq || 0) + 1;

  state.invoices.unshift({
    id: uid(),
    seq: state.seq,
    dateISO: now.toISOString(),
    dateText: formatDate(now),
    timeText: formatTime(now),
    items
  });

  /* تفريغ المسودة بعد الحفظ */
  SECTIONS.forEach(s => state.draft[s.id] = []);

  persist();
  renderAll();
  toast('تم حفظ الفاتورة بنجاح 🎉', 'ok');

  document.getElementById('invoices').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ============================================================
   نسخ الفاتورة كنص
   ============================================================ */
function buildInvoiceText(inv){
  const lines = [];
  lines.push(`🧾 فاتورة رقم: ${inv.seq}`);
  lines.push(`📅 التاريخ: ${inv.dateText}`);
  lines.push(`🕐 الوقت: ${inv.timeText}`);
  lines.push('');
  lines.push('═══════════════════════');
  lines.push('');

  const groups = {};
  inv.items.forEach(it=>{
    (groups[it.sectionId] = groups[it.sectionId] || []).push(it);
  });

  Object.keys(groups).forEach(gid=>{
    lines.push(`${secIcon(gid)} ${secName(gid)}:`);
    groups[gid].forEach((it, i)=>{
      lines.push(`   ${i + 1}. ${it.name} — ${it.cartons} كرتون — ${it.pieces} قطعة`);
    });
    lines.push('');
  });

  lines.push('═══════════════════════');
  lines.push('');
  lines.push('نتمنا لكم طريق السلامه');
  return lines.join('\n');
}

async function copyInvoice(inv){
  const text = buildInvoiceText(inv);
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      ta.style.top = '0';
      ta.style.left = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('تم نسخ الفاتورة بنجاح 📋', 'ok');
  }catch(e){
    console.error(e);
    toast('تعذّر النسخ، حاول مرة أخرى', 'warn');
  }
}

/* ============================================================
   رسم الفواتير
   ============================================================ */
function renderInvoices(){
  const box = document.getElementById('invoices');
  const badge = document.getElementById('invCount');
  const pill  = document.getElementById('pillInvoices');

  badge.textContent = state.invoices.length;
  pill.textContent  = state.invoices.length;

  if(state.invoices.length === 0){
    box.innerHTML = `<div class="empty-inv"><span>🧾</span>لا توجد فواتير محفوظة بعد — أضف أصنافك ثم اضغط «حفظ الفاتورة»</div>`;
    return;
  }

  box.innerHTML = state.invoices.map(inv=>{
    /* تجميع حسب القسم */
    const groups = {};
    let totalCartons = 0, totalPieces = 0;
    inv.items.forEach(it=>{
      (groups[it.sectionId] = groups[it.sectionId] || []).push(it);
      totalCartons += it.cartons;
      totalPieces  += it.pieces;
    });

    const groupsHtml = Object.keys(groups).map(gid=>{
      const list = groups[gid];
      return `
        <div class="grp">
          <div class="grp-head"><span>${secIcon(gid)}</span><span>${secName(gid)}</span><span style="margin-right:auto;opacity:.6;font-size:.7rem">${list.length} صنف</span></div>
          ${list.map((it, i)=>`
            <div class="inv-item">
              <span class="inv-idx">${i + 1}</span>
              <span class="inv-name">${escapeHtml(it.name)}</span>
              <span class="qty-tag">${it.cartons} كرتون</span>
              <span class="qty-tag p">${it.pieces} قطعة</span>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');

    return `
      <div class="invoice" data-inv="${inv.id}">
        <div class="inv-head" data-toggle="${inv.id}">
          <div class="inv-num">#${inv.seq}</div>
          <div class="inv-meta">
            <h3>فاتورة رقم ${inv.seq}</h3>
            <p>📅 ${inv.dateText} &nbsp;·&nbsp; 🕐 ${inv.timeText}</p>
          </div>
          <div class="inv-stats">
            <span class="stat">أصناف <b>${inv.items.length}</b></span>
            <span class="stat">كراتين <b>${totalCartons}</b></span>
            <span class="stat">قطع <b>${totalPieces}</b></span>
          </div>
          <span class="chev">▼</span>
        </div>
        <div class="inv-body">
          <div class="inv-body-inner">
            ${groupsHtml}
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
              <button class="btn btn-ghost" data-copyinv="${inv.id}"
                      style="font-size:.75rem;padding:8px 16px;color:var(--accent);border-color:rgba(110,231,255,.4)">
                📋 نسخ الفاتورة
              </button>
              <button class="btn btn-ghost" data-delinv="${inv.id}" style="font-size:.75rem;padding:8px 16px">🗑️ حذف الفاتورة</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  /* فتح / إغلاق */
  box.querySelectorAll('[data-toggle]').forEach(head=>{
    head.addEventListener('click', ()=>{
      head.closest('.invoice').classList.toggle('open');
    });
  });

  /* نسخ فاتورة */
  box.querySelectorAll('[data-copyinv]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const inv = state.invoices.find(x => x.id === btn.dataset.copyinv);
      if(inv) copyInvoice(inv);
    });
  });

  /* حذف فاتورة */
  box.querySelectorAll('[data-delinv]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.dataset.delinv;
      state.invoices = state.invoices.filter(x => x.id !== id);
      persist();
      renderInvoices();
      toast('تم حذف الفاتورة', 'del');
    });
  });
}

/* ============================================================
   رسم الكل
   ============================================================ */
function renderAll(){
  SECTIONS.forEach(s => renderSection(s.id));
  renderSummary();
  renderInvoices();
}

/* ============================================================
   الأحداث العامة
   ============================================================ */
document.getElementById('saveInvoice').addEventListener('click', saveInvoice);

document.getElementById('clearDraft').addEventListener('click', ()=>{
  const has = SECTIONS.some(s => (state.draft[s.id] || []).length > 0);
  if(!has){ toast('لا يوجد ما يُمسح', 'warn'); return; }
  if(!confirm('هل تريد مسح كل الأصناف غير المحفوظة؟')) return;
  SECTIONS.forEach(s => state.draft[s.id] = []);
  persist();
  renderAll();
  toast('تم مسح المسودة', 'del');
});

/* تأثير Ripple على كل الأزرار */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.btn, .del, .inv-head');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (e.clientX - rect.left - size / 2) + 'px';
  span.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
  if(getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 680);
});

/* حفظ احتياطي عند إغلاق الصفحة */
window.addEventListener('beforeunload', persist);

/* ============================================================
   التشغيل
   ============================================================ */
load();
buildSections();
renderAll();
</script>
</body>
</html>
